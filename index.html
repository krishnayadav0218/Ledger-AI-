/* The full Python analysis engine — column detection, KPIs, time series,
   customer/category aggregation, forecasting (numpy), and every
   narrative/SQL/chat function. Runs inside Pyodide, entirely client-side. */
const PY_ENGINE_SOURCE = `
import json
import re
import numpy as np
import pandas as pd

# ============================================================================
# NUMBER / DATE PARSING (handles currency symbols, commas, odd formats)
# ============================================================================
def to_number(v):
    if v is None:
        return float("nan")
    if isinstance(v, (int, float)):
        return float(v) if v == v else float("nan")  # NaN check
    s = str(v).strip()
    if s == "" or s == "-" or s.lower() in ("na", "n/a"):
        return float("nan")
    neg = s.startswith("(") and s.endswith(")")
    if neg:
        s = s[1:-1]
    s = re.sub(r"[₹$€£¥,\\s]", "", s)
    s = s.rstrip("%")
    if s == "":
        return float("nan")
    try:
        n = float(s)
    except ValueError:
        return float("nan")
    return -n if neg else n


DATE_PATTERNS = [
    re.compile(r"^\\d{4}-\\d{1,2}-\\d{1,2}"),
    re.compile(r"^\\d{1,2}[/\\-]\\d{1,2}[/\\-]\\d{2,4}$"),
    re.compile(r"^\\d{1,2}\\s+[A-Za-z]{3,9}\\s+\\d{2,4}$"),
    re.compile(r"^[A-Za-z]{3,9}\\s+\\d{4}$"),
]

def looks_like_date_value(v):
    if v is None or isinstance(v, (int, float)):
        return False
    s = str(v).strip()
    if not any(p.match(s) for p in DATE_PATTERNS):
        return False
    try:
        pd.to_datetime(s)
        return True
    except Exception:
        return False


def fmt_money(n):
    if n is None or (isinstance(n, float) and np.isnan(n)):
        return "\\u2014"
    sign = "-" if n < 0 else ""
    a = abs(n)
    if a >= 1e7: return f"{sign}{a/1e7:.2f}Cr"
    if a >= 1e5: return f"{sign}{a/1e5:.2f}L"
    if a >= 1e3: return f"{sign}{a/1e3:.1f}K"
    return f"{sign}{round(a)}"

def fmt_num(n):
    if n is None or (isinstance(n, float) and np.isnan(n)):
        return "\\u2014"
    return f"{round(n):,}"


# ============================================================================
# COLUMN DETECTION (value-based — works even with unfamiliar headers)
# ============================================================================
def _detect_columns(df: pd.DataFrame):
    columns = list(df.columns)
    numeric_cols, string_cols, date_cols = [], [], []

    for col in columns:
        sample = df[col].dropna().astype(object).head(30).tolist()
        if not sample:
            continue
        date_hits = sum(looks_like_date_value(v) for v in sample)
        num_hits = sum(not np.isnan(to_number(v)) for v in sample)
        name_is_date = bool(re.search(r"date|month|period|day|year|time|dt$", col, re.I))
        if name_is_date or date_hits >= 0.7 * len(sample):
            date_cols.append(col)
        elif num_hits >= 0.7 * len(sample):
            numeric_cols.append(col)
        else:
            string_cols.append(col)

    date_col = date_cols[0] if date_cols else None

    id_like = re.compile(r"(^|_)(id|no|num|code)(s)?$|number$", re.I)
    name_match_revenue = next((c for c in numeric_cols
                                if re.search(r"revenue|sales|amount|amt|total|price|value|cost|income|earning|turnover", c, re.I)), None)
    revenue_col = name_match_revenue
    if revenue_col is None and numeric_cols:
        candidates = [c for c in numeric_cols if not id_like.search(c)] or numeric_cols
        sums = {c: df[c].map(to_number).abs().sum() for c in candidates}
        revenue_col = max(sums, key=sums.get)

    category_like = re.compile(r"region|status|type|category|segment|country|state|gender|channel|method", re.I)
    name_match_customer = next((c for c in string_cols
                                 if re.search(r"customer|client|account|company|buyer|vendor|user|name", c, re.I)), None)
    customer_col = name_match_customer
    if customer_col is None and string_cols:
        scored = []
        for c in string_cols:
            vals = df[c].dropna()
            uniq = vals.nunique()
            ratio = uniq / len(vals) if len(vals) else 0
            is_cat = bool(category_like.search(c)) or uniq <= 4
            is_free_text = ratio > 0.9 and len(vals) > 10
            penalty = 1 if (is_cat or is_free_text) else 0
            scored.append((c, uniq, penalty))
        clean = [s for s in scored if s[2] == 0] or scored
        clean.sort(key=lambda s: -s[1])
        customer_col = clean[0][0]

    return dict(columns=columns, numericCols=numeric_cols, stringCols=string_cols,
                dateCol=date_col, revenueCol=revenue_col, customerCol=customer_col)


def detect_columns(rows_json):
    rows = json.loads(rows_json)
    if not rows:
        return json.dumps(dict(columns=[], numericCols=[], stringCols=[], dateCol=None, revenueCol=None, customerCol=None))
    df = pd.DataFrame(rows)
    return json.dumps(_detect_columns(df))


# ============================================================================
# KPIs / TIME SERIES / BREAKDOWNS  (all pandas — this is the "analysis" layer)
# ============================================================================
def compute_kpis(rows_json, revenue_col, customer_col, date_col):
    rows = json.loads(rows_json)
    revenue_col = json.loads(revenue_col)
    customer_col = json.loads(customer_col)
    date_col = json.loads(date_col)
    df = pd.DataFrame(rows)
    kpis = []
    if not len(df):
        return json.dumps(kpis)

    if revenue_col:
        vals = df[revenue_col].map(to_number)
        total = vals.sum()
        avg = vals.mean()
        kpis.append(dict(label=f"Total {revenue_col}", value=fmt_money(total), raw=float(total), kind="money"))
        kpis.append(dict(label=f"Avg {revenue_col} / row", value=fmt_money(avg), raw=float(avg), kind="money"))
    kpis.append(dict(label="Total Records", value=fmt_num(len(df)), raw=len(df), kind="count"))
    if customer_col:
        uniq = df[customer_col].nunique()
        kpis.append(dict(label=f"Unique {customer_col}", value=fmt_num(uniq), raw=int(uniq), kind="count"))

    growth = None
    if revenue_col:
        d = df.copy()
        if date_col:
            d["_d"] = pd.to_datetime(d[date_col], errors="coerce")
            d = d.sort_values("_d")
        mid = len(d) // 2
        first, second = d.iloc[:mid], d.iloc[mid:]
        a = first[revenue_col].map(to_number).sum()
        b = second[revenue_col].map(to_number).sum()
        if a and a > 0:
            growth = (b - a) / a * 100
    if growth is not None:
        kpis.append(dict(label="Period-over-period growth",
                          value=f"{'+' if growth>=0 else ''}{growth:.1f}%", raw=float(growth), isDelta=True, kind="percent"))
    return json.dumps(kpis)


def build_time_series(rows_json, date_col, revenue_col):
    rows = json.loads(rows_json)
    date_col = json.loads(date_col)
    revenue_col = json.loads(revenue_col)
    if not date_col or not revenue_col or not rows:
        return json.dumps([])
    df = pd.DataFrame(rows)
    d = df.copy()
    d["_d"] = pd.to_datetime(d[date_col], errors="coerce")
    d = d.dropna(subset=["_d"])
    d["_v"] = d[revenue_col].map(to_number)
    ts = d.groupby(d["_d"].dt.date)["_v"].sum().reset_index()
    ts.columns = ["date", "value"]
    ts = ts.sort_values("date")
    return json.dumps([{"date": str(r["date"]), "value": float(r["value"])} for _, r in ts.iterrows()])


def category_breakdown(rows_json, category_col, revenue_col):
    rows = json.loads(rows_json)
    category_col = json.loads(category_col)
    revenue_col = json.loads(revenue_col)
    if not category_col or not revenue_col or not rows:
        return json.dumps([])
    df = pd.DataFrame(rows)
    grp = df.groupby(category_col)[revenue_col].apply(lambda s: s.map(to_number).sum()).sort_values(ascending=False).head(6)
    return json.dumps([{"name": str(k), "value": float(v)} for k, v in grp.items()])


def customer_ranking(rows_json, customer_col, revenue_col):
    rows = json.loads(rows_json)
    customer_col = json.loads(customer_col)
    revenue_col = json.loads(revenue_col)
    if not customer_col or not revenue_col or not rows:
        return json.dumps([])
    df = pd.DataFrame(rows)
    grp = df.groupby(customer_col)[revenue_col].apply(lambda s: s.map(to_number).sum()).sort_values(ascending=False)
    return json.dumps([{"name": str(k), "value": float(v)} for k, v in grp.items()])


def customer_segments(ranking_json):
    ranking = json.loads(ranking_json)
    n = len(ranking)
    if n == 0:
        return json.dumps([])
    high_cut = max(1, -(-n * 20 // 100))
    med_cut = max(high_cut + 1, -(-n * 60 // 100))
    seg = [
        dict(name="High value (top 20%)", value=sum(c["value"] for c in ranking[:high_cut])),
        dict(name="Mid value", value=sum(c["value"] for c in ranking[high_cut:med_cut])),
        dict(name="Long tail", value=sum(c["value"] for c in ranking[med_cut:])),
    ]
    return json.dumps([s for s in seg if s["value"] > 0])


# ============================================================================
# FORECAST — pure numpy least-squares fit (real regression, no LLM, no scipy)
# ============================================================================
def run_forecast(timeseries_json, horizon):
    ts = json.loads(timeseries_json)
    horizon = json.loads(horizon)
    n = len(ts)
    if n < 3:
        return json.dumps(dict(combined=[], slope=0, r2=0, model="none"))

    y = np.array([p["value"] for p in ts], dtype=float)
    x = np.arange(n, dtype=float)
    dates = pd.to_datetime([p["date"] for p in ts])

    def r2_of(y_actual, y_fit):
        ss_res = np.sum((y_actual - y_fit) ** 2)
        ss_tot = np.sum((y_actual - np.mean(y_actual)) ** 2)
        return float(1 - ss_res / ss_tot) if ss_tot > 0 else 0.0

    # Linear fit (always available)
    lin_coef = np.polyfit(x, y, 1)
    lin_fit = np.polyval(lin_coef, x)
    lin_r2 = r2_of(y, lin_fit)

    # Quadratic fit — only considered with enough points to avoid overfitting,
    # and only adopted if it improves R2 by a meaningful margin.
    use_quad = False
    if n >= 8:
        quad_coef = np.polyfit(x, y, 2)
        quad_fit = np.polyval(quad_coef, x)
        quad_r2 = r2_of(y, quad_fit)
        if quad_r2 > lin_r2 + 0.05:
            use_quad = True

    if use_quad:
        coef, fit, r2, model_name = quad_coef, quad_fit, quad_r2, "quadratic"
    else:
        coef, fit, r2, model_name = lin_coef, lin_fit, lin_r2, "linear"

    residual_std = float(np.std(y - fit))

    # Monthly seasonal index: average ratio of actual/trend per calendar
    # month, applied multiplicatively to future predictions. Only attempted
    # with at least a full year of history so the index is meaningful.
    seasonal_index = {}
    used_seasonality = False
    if n >= 12:
        safe_fit = np.where(fit == 0, 1e-9, fit)
        ratio = y / safe_fit
        months = dates.month.values
        for m in range(1, 13):
            vals = ratio[months == m]
            if len(vals) > 0:
                seasonal_index[m] = float(np.clip(np.mean(vals), 0.5, 1.5))
        if len(seasonal_index) >= 6:
            used_seasonality = True

    future_x = np.arange(n, n + horizon, dtype=float)
    future_trend = np.polyval(coef, future_x)
    last_date = dates[-1]
    future_dates = [last_date + pd.DateOffset(months=i + 1) for i in range(horizon)]

    preds = []
    for i in range(horizon):
        base = future_trend[i]
        if used_seasonality:
            m = future_dates[i].month
            base = base * seasonal_index.get(m, 1.0)
        preds.append(max(0.0, float(base)))
    preds = np.array(preds)

    # ~90% prediction interval band from residual spread (widens slightly
    # further out, since uncertainty compounds the further we project).
    z = 1.645
    lower = np.maximum(0, preds - z * residual_std * np.sqrt(1 + np.arange(1, horizon + 1) / n))
    upper = preds + z * residual_std * np.sqrt(1 + np.arange(1, horizon + 1) / n)

    combined = [{"date": ts[i]["date"], "actual": ts[i]["value"], "predicted": None,
                 "predictedLow": None, "predictedHigh": None} for i in range(n)]
    combined += [{"date": future_dates[i].strftime("%Y-%m-%d"), "actual": None,
                  "predicted": float(preds[i]), "predictedLow": float(lower[i]), "predictedHigh": float(upper[i])}
                 for i in range(horizon)]

    slope_out = float(coef[-2]) if model_name == "linear" else float(2 * coef[0] * (n - 1) + coef[1])
    return json.dumps(dict(
        combined=combined, slope=slope_out, r2=float(r2), model=model_name,
        seasonalityUsed=used_seasonality, residualStd=residual_std,
    ))


# ============================================================================
# GROWTH BREAKDOWN — period-over-period % change table (pandas/numpy)
# ============================================================================
def growth_breakdown(timeseries_json):
    ts = json.loads(timeseries_json)
    out = []
    for i, p in enumerate(ts):
        if i == 0:
            out.append(dict(date=p["date"], value=p["value"], changePct=None))
        else:
            prev = ts[i - 1]["value"]
            change = ((p["value"] - prev) / prev * 100) if prev else None
            out.append(dict(date=p["date"], value=p["value"], changePct=round(change, 1) if change is not None else None))
    return json.dumps(out)


# ============================================================================
# CORRELATION MATRIX — between numeric columns (pandas)
# ============================================================================
def correlation_matrix(rows_json, numeric_cols_json):
    rows = json.loads(rows_json)
    numeric_cols = json.loads(numeric_cols_json)
    if not rows or len(numeric_cols) < 2:
        return json.dumps(dict(columns=[], matrix=[]))
    df = pd.DataFrame(rows)
    for c in numeric_cols:
        df[c] = df[c].map(to_number)
    corr = df[numeric_cols].corr()
    corr = corr.fillna(0)
    matrix = [[round(float(v), 2) for v in row] for row in corr.values]
    return json.dumps(dict(columns=numeric_cols, matrix=matrix))

# NARRATIVE GENERATION — rule-based, multi-language, no LLM
# ============================================================================
def build_insight_narrative(lang, kpis_json, category_json, revenue_col):
    lang = json.loads(lang)
    kpis = json.loads(kpis_json)
    category_breakdown_ = json.loads(category_json)
    revenue_col = json.loads(revenue_col)
    p = PHRASES.get(lang, PHRASES["hinglish"])
    parts = []

    total_kpi = next((k for k in kpis if k["label"].startswith("Total")), None)
    records_kpi = next((k for k in kpis if k["label"] == "Total Records"), None)
    growth_kpi = next((k for k in kpis if k.get("isDelta")), None)

    if total_kpi and records_kpi:
        parts.append(p["total"].format(metric=revenue_col or "value", value=total_kpi["value"], records=records_kpi["value"]))

    if growth_kpi is not None:
        g = growth_kpi["raw"]
        if g > 3:
            parts.append(p["growth_up"].format(growth=f"{g:.1f}"))
        elif g < -3:
            parts.append(p["growth_down"].format(growth=f"{abs(g):.1f}"))
        else:
            parts.append(p["growth_flat"])

    if category_breakdown_:
        top = category_breakdown_[0]
        total_cat = sum(c["value"] for c in category_breakdown_)
        share = (top["value"] / total_cat * 100) if total_cat else 0
        parts.append(p["top_driver"].format(top=top["name"], share=f"{share:.0f}"))
        if share > 40:
            parts.append(p["concentration_high"].format(top=top["name"]))
        else:
            parts.append(p["concentration_ok"])
        parts.append(p["action"].format(top=top["name"]))

    return json.dumps(" ".join(parts))


def build_forecast_narrative(lang, forecast_json, horizon):
    lang = json.loads(lang)
    forecast_result = json.loads(forecast_json)
    horizon = json.loads(horizon)
    p = PHRASES.get(lang, PHRASES["hinglish"])
    combined = forecast_result["combined"]
    if not combined:
        return json.dumps("")
    slope = forecast_result["slope"]
    r2 = forecast_result["r2"]
    future_vals = [c["predicted"] for c in combined if c["predicted"] is not None]
    last_projected = future_vals[-1] if future_vals else 0

    parts = []
    if slope > 0 and abs(slope) > 1e-6:
        parts.append(p["forecast_up"].format(horizon=horizon, value=fmt_num(last_projected), r2=f"{r2:.2f}"))
    elif slope < 0 and abs(slope) > 1e-6:
        parts.append(p["forecast_down"].format(horizon=horizon, value=fmt_num(last_projected), r2=f"{r2:.2f}"))
    else:
        parts.append(p["forecast_flat"].format(value=fmt_num(last_projected)))

    if r2 < 0.4:
        parts.append(p["forecast_confidence_low"].format(r2=f"{r2:.2f}"))
    else:
        parts.append(p["forecast_confidence_ok"].format(r2=f"{r2:.2f}"))

    if forecast_result.get("seasonalityUsed") and "forecast_seasonal_note" in p:
        parts.append(p["forecast_seasonal_note"])

    parts.append(p["forecast_risk"])
    return json.dumps(" ".join(parts))

# RULE-BASED SQL GENERATOR (pattern matching over the detected schema)
# ============================================================================
def generate_sql(question, columns_json, numeric_cols_json):
    question = json.loads(question)
    columns = json.loads(columns_json)
    numeric_cols = json.loads(numeric_cols_json)
    q = question.lower().strip()

    def find_col(text, cols):
        for c in cols:
            if c.lower() in text:
                return c
        return None

    top_n_match = re.search(r"top\\s+(\\d+)", q)
    bottom_n_match = re.search(r"(bottom|lowest|least)\\s+(\\d+)", q)
    agg = "SUM"
    if re.search(r"\\baverage\\b|\\bavg\\b", q):
        agg = "AVG"
    elif re.search(r"\\bcount\\b|\\bhow many\\b|\\bnumber of\\b", q):
        agg = "COUNT"
    elif re.search(r"\\bmax(imum)?\\b|\\bhighest single\\b", q):
        agg = "MAX"
    elif re.search(r"\\bmin(imum)?\\b", q):
        agg = "MIN"

    metric_col = find_col(q, numeric_cols) or (numeric_cols[0] if numeric_cols else None)
    group_col = find_col(q, [c for c in columns if c != metric_col])

    order_desc = not bool(re.search(r"lowest|least|ascending|bottom", q))
    limit = None
    if top_n_match:
        limit = int(top_n_match.group(1))
        order_desc = True
    elif bottom_n_match:
        limit = int(bottom_n_match.group(2))
        order_desc = False

    if group_col and metric_col:
        agg_expr = "COUNT(*)" if agg == "COUNT" else f"{agg}({metric_col})"
        sql = f"SELECT {group_col}, {agg_expr} AS {agg.lower()}_{metric_col}\\nFROM data\\nGROUP BY {group_col}\\nORDER BY {agg.lower()}_{metric_col} {'DESC' if order_desc else 'ASC'}"
        if limit:
            sql += f"\\nLIMIT {limit}"
        return json.dumps(dict(sql=sql, matched=True))
    elif metric_col:
        agg_expr = "COUNT(*)" if agg == "COUNT" else f"{agg}({metric_col})"
        return json.dumps(dict(sql=f"SELECT {agg_expr} AS result\\nFROM data", matched=True))
    else:
        return json.dumps(dict(
            sql="-- Request thoda unclear tha, ismein koi known column/metric match nahi hua.\\nSELECT *\\nFROM data\\nLIMIT 100",
            matched=False,
        ))

    customer_col = json.loads(customer_col)
    date_col = json.loads(date_col)
    lang = json.loads(lang)

    q = question.lower()
    lp = PHRASES.get(lang, PHRASES["hinglish"])
    fallback = CHAT_NO_MATCH.get(lang, CHAT_NO_MATCH["hinglish"]).format(
        revenue=revenue_col or "value", customer=customer_col or "group"
    )

    if revenue_col is None or not rows:
        return json.dumps(fallback)

    df = pd.DataFrame(rows)
    vals = df[revenue_col].map(to_number)

    if re.search(r"total|sum|kitna|\\u0915\\u0941\\u0932", q) and not re.search(r"top|highest|sabse", q):
        return json.dumps(lp["total"].format(metric=revenue_col, value=fmt_money(vals.sum()), records=fmt_num(len(df))))

    if customer_col and re.search(r"top|highest|sabse (zyada|jyada)|best", q):
        grp = df.groupby(customer_col)[revenue_col].apply(lambda s: s.map(to_number).sum()).sort_values(ascending=False)
        if len(grp):
            top_name, top_val = grp.index[0], grp.iloc[0]
            share = top_val / vals.sum() * 100 if vals.sum() else 0
            return json.dumps(lp["top_driver"].format(top=top_name, share=f"{share:.0f}") + " " + fmt_money(top_val))

    if customer_col and re.search(r"lowest|least|worst|sabse kam", q):
        grp = df.groupby(customer_col)[revenue_col].apply(lambda s: s.map(to_number).sum()).sort_values()
        if len(grp):
            return json.dumps(f"{grp.index[0]}: {fmt_money(grp.iloc[0])}")

    if re.search(r"trend|growth|badh|ghat", q) and date_col:
        d = df.copy()
        d["_d"] = pd.to_datetime(d[date_col], errors="coerce")
        d = d.dropna(subset=["_d"])
        d["_v"] = d[revenue_col].map(to_number)
        ts = d.groupby(d["_d"].dt.date)["_v"].sum().sort_index()
        if len(ts) >= 2:
            g = (ts.iloc[-1] - ts.iloc[0]) / ts.iloc[0] * 100 if ts.iloc[0] else 0
            key = "growth_up" if g > 3 else "growth_down" if g < -3 else "growth_flat"
            return json.dumps(lp[key].format(growth=f"{abs(g):.1f}"))

    if re.search(r"average|avg|\\u0914\\u0938\\u0924", q):
        return json.dumps(f"{revenue_col} average: {fmt_money(vals.mean())}")

    if re.search(r"how many|count|kitne", q):
        return json.dumps(fmt_num(len(df)))

    return json.dumps(fallback)


# ============================================================================
# DATA QUALITY — null%, duplicates, per-column stats (pandas)
# ============================================================================
def data_quality(rows_json):
    rows = json.loads(rows_json)
    if not rows:
        return json.dumps(dict(totalRows=0, duplicateRows=0, columns=[]))
    df = pd.DataFrame(rows)
    total = len(df)
    dup_count = int(df.duplicated().sum())

    col_stats = []
    for col in df.columns:
        series = df[col]
        null_count = int(series.isna().sum() + (series.astype(object) == "").sum())
        null_pct = round(null_count / total * 100, 1) if total else 0
        uniq = int(series.nunique())
        sample = series.dropna().astype(object).head(20).tolist()
        num_hits = sum(not np.isnan(to_number(v)) for v in sample) if sample else 0
        kind = "numeric" if sample and num_hits >= 0.7 * len(sample) else "text"
        col_stats.append(dict(
            name=col, nullCount=null_count, nullPct=null_pct,
            uniqueCount=uniq, kind=kind,
        ))

    return json.dumps(dict(totalRows=total, duplicateRows=dup_count, columns=col_stats))


# ============================================================================
# ANOMALY DETECTION — z-score outliers on the revenue time series (numpy)
# ============================================================================
def detect_anomalies(timeseries_json):
    ts = json.loads(timeseries_json)
    n = len(ts)
    if n < 5:
        return json.dumps([])
    values = np.array([p["value"] for p in ts], dtype=float)
    mean = values.mean()
    std = values.std()
    if std == 0:
        return json.dumps([])
    z_scores = (values - mean) / std
    anomalies = []
    for i, z in enumerate(z_scores):
        if abs(z) >= 2.0:
            anomalies.append(dict(
                date=ts[i]["date"], value=float(values[i]),
                z=round(float(z), 2), direction="high" if z > 0 else "low",
            ))
    return json.dumps(anomalies)

/* -------------------------------- PERSISTENCE ------------------------------- */
/* Wrapped in try/catch: private-browsing/storage-disabled contexts throw on
   access, and this app should degrade to in-memory-only rather than crash. */
const LS_PREFIX = "ledgerai_";
function lsGet(key, fallback) {
  try {
    const raw = localStorage.getItem(LS_PREFIX + key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}
function lsSet(key, value) {
  try {
    localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
  } catch (e) {
    /* storage full or unavailable — silently skip persistence */
  }
}
function lsRemove(key) {
  try {
    localStorage.removeItem(LS_PREFIX + key);
  } catch (e) {}
}

/* ------------------------------- SAMPLE DATA -------------------------------- */
function genSampleData() {
  const customers = ["Nimbus Retail", "Arka Textiles", "Vertex Logistics", "Solara Foods", "Kestrel Media", "Bluepeak Tech", "Orchid Pharma", "Granite Motors"];
  const regions = ["North", "South", "East", "West"];
  const products = ["Starter Plan", "Growth Plan", "Enterprise Plan", "Add-on: Analytics", "Add-on: Support"];
  const rows = [];
  const start = new Date(2024, 6, 1);
  for (let m = 0; m < 24; m++) {
    const d = new Date(start.getFullYear(), start.getMonth() + m, 1);
    const seasonal = 1 + 0.15 * Math.sin((m / 12) * Math.PI * 2);
    const trend = 1 + m * 0.045;
    const rowsThisMonth = 6 + Math.floor(Math.random() * 4);
    for (let r = 0; r < rowsThisMonth; r++) {
      const base = 8000 + Math.random() * 14000;
      const revenue = Math.round(base * seasonal * trend);
      const units = Math.round(revenue / (120 + Math.random() * 60));
      const cost = Math.round(revenue * (0.42 + Math.random() * 0.15));
      rows.push({
        Date: d.toISOString().slice(0, 10),
        Customer: customers[Math.floor(Math.random() * customers.length)],
        Region: regions[Math.floor(Math.random() * regions.length)],
        Product: products[Math.floor(Math.random() * products.length)],
        Revenue: revenue,
        Units: units,
        Cost: cost,
      });
    }
  }
  return rows;
}

/* --------------------------------- HELPERS --------------------------------- */
/* Display-only formatters for chart axes/tooltips. All data parsing,
   column detection, and number cleaning happens in Python (py_engine)
   now — these just format already-computed numbers for the UI. */
function fmtMoney(n) {
  if (n === undefined || n === null || isNaN(n)) return "\u2014";
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(n);
  if (abs >= 1e7) return sign + (abs / 1e7).toFixed(2) + "Cr";
  if (abs >= 1e5) return sign + (abs / 1e5).toFixed(2) + "L";
  if (abs >= 1e3) return sign + (abs / 1e3).toFixed(1) + "K";
  return sign + Math.round(abs).toString();
}
function fmtNum(n) {
  if (n === undefined || n === null || isNaN(n)) return "\u2014";
  return Math.round(n).toLocaleString("en-IN");
}

/* All "AI" features (Insight, Forecast Narrative, SQL Generator, Chat) run
   entirely through Python via Pyodide (loaded below) — numpy/pandas
   for the actual analysis, hand-written multi-language templates for the
   narrative text. No cloud API, no API key, works fully offline once the
   Python runtime has loaded once. */
let pyodideInstance = null;

async function callPy(name, ...args) {
  if (!pyodideInstance) throw new Error("Python engine abhi load ho raha hai, thoda ruko.");
  const fn = pyodideInstance.globals.get(name);
  const jsonArgs = args.map((a) => JSON.stringify(a));
  const raw = fn(...jsonArgs);
  return JSON.parse(raw);
}

          <span className="ticker-item" key={i}>

          </span>
        ))}

/* Lightweight count-up animation (no external animation library needed —
   plain requestAnimationFrame with an ease-out curve). Animates from the
   previous value to the new one whenever `value` changes, e.g. after a
   date-range filter or a new file upload. */
function AnimatedNumber({ value, format }) {
  const [display, setDisplay] = useState(value || 0);
  const fromRef = useRef(0);
  const rafRef = useRef(null);

  useEffect(() => {
    const from = fromRef.current;
    const to = typeof value === "number" && !isNaN(value) ? value : 0;
    const duration = 700;
    const startTime = performance.now();
    if (rafRef.current) cancelAnimationFrame(rafRef.current);

    function tick(now) {
      const elapsed = now - startTime;
      const t = Math.min(1, elapsed / duration);
      const eased = 1 - Math.pow(1 - t, 3); // ease-out-cubic
      const current = from + (to - from) * eased;
      setDisplay(current);
      if (t < 1) {
        rafRef.current = requestAnimationFrame(tick);
      } else {
        fromRef.current = to;
      }
    }
    rafRef.current = requestAnimationFrame(tick);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [value]);

  return <>{format(display)}</>;
}

function formatKpiValue(kind, v) {
  if (kind === "money") return fmtMoney(v);
  if (kind === "percent") return `${v >= 0 ? "+" : ""}${v.toFixed(1)}%`;
  return fmtNum(v);
}

  const [matched, setMatched] = useState(true);
  const [loading, setLoading] = useState(false);
  const [copied, setCopied] = useState(false);

  const generate = async () => {
    if (!question.trim()) return;
    setLoading(true);
    setSql("");
    try {
      const result = await callPy("generate_sql", question, columns, numericCols);
      setSql(result.sql);
      setMatched(result.matched);
    } catch (e) {
      setSql("-- Python engine abhi ready nahi hai, thoda ruk kar dobara try karo.");
      setMatched(false);
    }
    setLoading(false);

    setCopied(true);

  return (
    <div>

          {columns.join(",  ")}
        </div>
      </div>

      <div className="card" style={{ marginBottom: 16 }}>
        <div className="card-title">Describe what you want in plain English <span className="lg-note-inline">(Python pattern-matching — no cloud API)</span></div>
        <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 8 }}>
          Simple, direct phrasing kaam karti hai: "top 5 customer by revenue", "total revenue", "average units", "lowest 3 region by cost"
        </div>
        <textarea
          className="bi-textarea"
          placeholder="e.g. top 5 customer by revenue"
          value={question}
          onChange={(e) => setQuestion(e.target.value)}
        />
        <div style={{ marginTop: 10 }}>
          <button className="btn btn-accent" onClick={generate} disabled={loading || !question.trim()}>
            {loading ? <Loader2 size={14} style={{ animation: "spin 1s linear infinite" }} /> : <Terminal size={14} />}
            Generate SQL
          </button>
        </div>
      </div>

      {sql && (
        <div className="card">
          <div className="card-title" style={{ display: "flex", justifyContent: "space-between" }}>
            <span>Generated SQL</span>
            <span className="btn no-print" style={{ padding: "4px 10px" }} onClick={copy}>
              {copied ? <Check size={12} /> : <Copy size={12} />} {copied ? "Copied" : "Copy"}
            </span>
          </div>
          <div className="code-block">{sql}</div>
          {!matched && (
            <div style={{ fontSize: 12, color: "var(--neg)", marginTop: 8 }}>
              Pattern match nahi hua — thoda simple tarike se phir try karo, jaise "top N &lt;group&gt; by &lt;metric&gt;".
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ============================================================================
   CHAT VIEW
   ============================================================================ */
function ChatView({ rows, columns, kpis, revenueCol, customerCol, dateCol }) {
  const [messages, setMessages] = useState([
    { role: "ai", text: "Hi! Apne data ke baare me kuch bhi poochho \u2014 jaise 'sabse zyada revenue kis customer se aaya?' ya 'total revenue kitna hai?'" },
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [lang, setLang] = useState("hinglish");
  const scrollRef = useRef(null);

  const send = async () => {
    if (!input.trim() || loading) return;
    const userMsg = input.trim();
    setMessages((m) => [...m, { role: "user", text: userMsg }]);
    setInput("");
    setLoading(true);

    try {
      const text = await callPy("answer_chat", userMsg, rows, revenueCol, customerCol, dateCol, lang);
      setMessages((m) => [...m, { role: "ai", text }]);
    } catch (e) {
      setMessages((m) => [...m, { role: "ai", text: "Python engine abhi ready nahi hai \u2014 thoda ruk kar dobara try karo." }]);
    }
    setLoading(false);
    setTimeout(() => scrollRef.current?.scrollTo({ top: 999999, behavior: "smooth" }), 50);
  };

  return (
    <div className="card" style={{ display: "flex", flexDirection: "column", height: "60vh", padding: 0, overflow: "hidden" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", borderBottom: "1px solid var(--border)" }}>
        <span className="lg-note-inline" style={{ marginLeft: 0 }}>Rule-based over pandas — no cloud API</span>
        <select className="bi-select" style={{ width: "auto" }} value={lang} onChange={(e) => setLang(e.target.value)}>
          {LANGUAGES.map((l) => <option key={l.id} value={l.id}>{l.label}</option>)}
        </select>
      </div>
      <div className="chat-scroll" ref={scrollRef}>
        {messages.map((m, i) => (
          <div key={i} className={m.role === "user" ? "chat-bubble-user" : "chat-bubble-ai"}>
            {m.text}
          </div>
        ))}
        {loading && <div className="chat-bubble-ai" style={{ color: "var(--muted)" }}>Soch raha hoon...</div>}
      </div>
      <div className="chat-input-row">
        <input
          className="chat-input"
          placeholder="Apna sawaal type karein..."
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && send()}
        />
        <button className="btn btn-accent" onClick={send} disabled={loading}>
          <Send size={14} />
        </button>
      </div>
    </div>
  );
}

/* ============================================================================
   UPLOAD VIEW
   ============================================================================ */
function UploadView({
  onDrop, fileInputRef, handleFile, fileName, rows, columns,
  autoDetected, dateCol, revenueCol, customerCol,
  manualDate, manualRevenue, manualCustomer,
  setManualDate, setManualRevenue, setManualCustomer,
  sheetNames, activeSheet, switchSheet, loadSampleData, downloadCSV, dataQuality,
}) {
  return (
    <div>
      <div
        className="dropzone"
        onDrop={onDrop}
        onDragOver={(e) => e.preventDefault()}
        onClick={() => fileInputRef.current?.click()}
      >
        <Upload size={30} style={{ color: "var(--accent)", marginBottom: 10 }} />
        <div style={{ fontWeight: 600, marginBottom: 4 }}>CSV ya Excel file yahan drop karein</div>
        <div style={{ color: "var(--muted)", fontSize: 12.5 }}>ya click karke browse karein · .csv, .xlsx, .xls supported · column ka naam kuch bhi ho, chalega</div>
      </div>

      {sheetNames && sheetNames.length > 1 && (
        <div className="card" style={{ marginTop: 16 }}>
          <div className="card-title">Sheet</div>
          <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 10 }}>
            Is workbook mein {sheetNames.length} sheets hain — jo dekhni ho woh chuno.
          </div>
          <select className="bi-select" value={activeSheet || ""} onChange={(e) => switchSheet(e.target.value)}>
            {sheetNames.map((s) => <option key={s} value={s}>{s}</option>)}
          </select>
        </div>
      )}

      <div className="card" style={{ marginTop: 16 }}>
        <div className="card-title">Column Mapping</div>
        <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 12 }}>
          App ne yeh roles khud detect kiye hain. Agar galat lage (column names alag/ajeeb hain), yahan se sahi column chun lo — Dashboard, Forecast aur Customer views turant update ho jayenge.
        </div>
        <div className="grid-3">
          <MappingSelect
            label="Date column"
            columns={columns}
            value={manualDate ?? autoDetected.dateCol ?? ""}
            autoValue={autoDetected.dateCol}
            onChange={(v) => setManualDate(v || null)}
          />
          <MappingSelect
            label="Revenue / value column"
            columns={columns}
            value={manualRevenue ?? autoDetected.revenueCol ?? ""}
            autoValue={autoDetected.revenueCol}
            onChange={(v) => setManualRevenue(v || null)}
          />
          <MappingSelect
            label="Customer / entity column"
            columns={columns}
            value={manualCustomer ?? autoDetected.customerCol ?? ""}
            autoValue={autoDetected.customerCol}
            onChange={(v) => setManualCustomer(v || null)}
          />
        </div>
      </div>

      <div className="card" style={{ marginTop: 16 }}>
        <div className="card-title" style={{ display: "flex", justifyContent: "space-between" }}>
          <span>Currently loaded</span>
          <span style={{ display: "flex", gap: 8 }}>
            <span className="btn no-print" style={{ padding: "4px 10px" }} onClick={() => downloadCSV(rows, "data_export.csv")}>
              <FileDown size={12} /> Download CSV
            </span>
            <span className="btn no-print" style={{ padding: "4px 10px" }} onClick={loadSampleData}>
              Load Sample Data
            </span>
          </span>
        </div>
        <div style={{ fontSize: 13, marginBottom: 10 }}>
          <strong>{fileName}</strong> · {rows.length} rows · {columns.length} columns
        </div>
        <table className="bi-table">
          <thead>
            <tr>{columns.map((c) => <th key={c}>{c}</th>)}</tr>
          </thead>
          <tbody>
            {rows.slice(0, 8).map((r, i) => (
              <tr key={i}>
                {columns.map((c) => <td key={c} style={{ fontFamily: "Inter,sans-serif" }}>{String(r[c])}</td>)}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {dataQuality && dataQuality.columns && dataQuality.columns.length > 0 && (
        <div className="card" style={{ marginTop: 16 }}>
          <div className="card-title">Data Quality <span className="lg-note-inline">(pandas — computed on upload)</span></div>
          <div style={{ display: "flex", gap: 20, marginBottom: 10, fontSize: 12.5, color: "var(--muted)" }}>
            <span>Total rows: <strong style={{ color: "var(--text)" }}>{fmtNum(dataQuality.totalRows)}</strong></span>
            <span>Duplicate rows: <strong style={{ color: dataQuality.duplicateRows > 0 ? "var(--neg)" : "var(--text)" }}>{fmtNum(dataQuality.duplicateRows)}</strong></span>
          </div>
          {dataQuality.columns.map((c) => (
            <div className="quality-row" key={c.name}>
              <span style={{ fontFamily: "'JetBrains Mono',monospace" }}>{c.name}</span>
              <span style={{ color: "var(--muted)" }}>{c.kind} · {c.uniqueCount} unique</span>
              <span style={{ color: c.nullPct > 0 ? "var(--neg)" : "var(--pos)" }}>
                {c.nullPct > 0 ? `${c.nullPct}% missing` : "complete"}
              </span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================================
   MAPPING SELECT (small dropdown used in the Column Mapping card)
   ============================================================================ */
function MappingSelect({ label, columns, value, autoValue, onChange }) {
  return (
    <div>
      <div style={{ fontSize: 11, color: "var(--muted)", textTransform: "uppercase", letterSpacing: ".04em", marginBottom: 6 }}>
        {label}
      </div>
      <select className="bi-select" value={value} onChange={(e) => onChange(e.target.value)}>
        <option value="">— none —</option>
        {columns.map((c) => (
          <option key={c} value={c}>
            {c}{c === autoValue ? " (auto-detected)" : ""}
          </option>
        ))}
      </select>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<BIDashboard />);
</script>
</body>
</html>
